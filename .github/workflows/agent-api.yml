name: agent-api

on:
  push:
    branches: [main]
    paths: ["agent-api/**", ".github/workflows/agent-api.yml"]
  pull_request:
    paths: ["agent-api/**", ".github/workflows/agent-api.yml"]

defaults:
  run:
    working-directory: agent-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-api/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # LLM 호출은 모두 모킹되어 있어 API 키가 필요 없다.
        run: npm test
