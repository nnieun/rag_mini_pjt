name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "plugin/**", ".claude-plugin/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "plugin/**", ".claude-plugin/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Unit tests
        # LLM, Qdrant, PostgreSQL는 테스트에서 모두 모킹한다. 실제 키가 필요 없다.
        env:
          RAG_ANSWER_CACHE_ENABLED: "false"
          RAG_RERANK_PRELOAD: "false"
          RAG_CHECKPOINT_ENABLED: "false"
          RAG_TRACE_STORE_ENABLED: "false"
        run: uv run python -m unittest discover -s tests -v

      - name: MCP server tests
        # 도구 목록, 정상 호출, 스키마 오류(isError), 미허용 도구, /mcp HTTP, stdio 서브프로세스.
        # 위 단계에도 포함되지만, 실패했을 때 MCP 문제인지 바로 보이도록 따로 돌린다.
        env:
          RAG_ANSWER_CACHE_ENABLED: "false"
          RAG_RERANK_PRELOAD: "false"
          RAG_CHECKPOINT_ENABLED: "false"
          RAG_TRACE_STORE_ENABLED: "false"
        run: uv run python -m unittest tests.test_mcp_server tests.test_mcp_http tests.test_mcp_stdio -v
